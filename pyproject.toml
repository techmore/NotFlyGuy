[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notflyguy"
version = "0.2.0"
description = "A connectome-powered fruit fly agent"
requires-python = ">=3.10,<3.13"
# numpy/scipy are required: the measured circuit, the trainable readouts, and
# the group-chat policy are all built on them.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Reading the released MaleCNS feather tables (scripts/fetch_connectome.py,
# scripts/catalog_leg_neurons.py, scripts/extract_motor_circuit.py).
connectome = ["pyarrow>=18"]
# The FlyBody/MuJoCo body and the dashboard's JPEG frames.
body = [
    "flybody @ git+https://github.com/TuragaLab/flybody.git@d015e9bfe441bd90ae431bac24c55cb74bdbce26",
    "Pillow>=10",
]
all = ["notflyguy[dev,connectome,body]"]

[project.scripts]
notflyguy-demo = "notflyguy.demo:main"
notflyguy-server = "notflyguy.server:main"
notflyguy-benchmark = "notflyguy.benchmark:main"
notflyguy-train = "notflyguy.train:main"
notflyguy-train-chat = "notflyguy.train_chat:main"
notflyguy-chatlog = "notflyguy.chatlog:main"
notflyguy-corpus = "notflyguy.corpus:main"
notflyguy-wiring-control = "notflyguy.wiring_control:main"

[tool.setuptools.packages.find]
include = ["notflyguy*", "dr_adapter*"]

[tool.setuptools.package-data]
notflyguy = ["web/*.html"]
dr_adapter = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
# Correctness (F, E4/E7/E9, B), import order (I), and modern syntax (UP).
# Line length is deliberately not enforced: the trainer and adapter modules
# carry long self-describing argparse help strings and JSON report keys.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = [
    "B904",   # raise ... from err: the HTTP handlers return, they do not re-raise
    "B007",   # unused loop variables in report builders
    "B905",   # zip(strict=...) would be churn across the report builders
]

[tool.ruff.lint.per-file-ignores]
# The DragonRealms adapter is written one statement per line on purpose; it
# is removable and advisory-only (see dr_adapter/README.md).
"dr_adapter/*" = ["E401", "E701", "E702", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["notflyguy", "dr_adapter"]
