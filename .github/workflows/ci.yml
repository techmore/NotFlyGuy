name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # No MaleCNS download in CI: the test session writes a synthetic circuit
      # (see tests/conftest.py) and points NOTFLYGUY_DATA_ROOT at it.
      - run: python -m pytest -q
      - name: Dashboard smoke run (no body, no model)
        run: |
          python -m notflyguy.synthetic --root "$RUNNER_TEMP/circuit" > /dev/null
          NOTFLYGUY_DATA_ROOT="$RUNNER_TEMP/circuit" timeout 20 python -m notflyguy.server --no-body --no-replies --port 8766 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8766/api/state > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8766/api/state | python -c 'import json,sys; s=json.load(sys.stdin); assert s["chat"]["circuit_loaded"], s'
          curl -fsS http://127.0.0.1:8766/ | grep -q NotFlyGuy
