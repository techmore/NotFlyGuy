<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NotFlyGuy · Live habitat</title>
<style>body{margin:0;background:#10131a;color:#e9f0ff;font:16px system-ui}main{max-width:1000px;margin:40px auto;padding:20px}.card{background:#181e29;border:1px solid #2d394d;border-radius:16px;padding:20px;margin:16px 0}img{width:100%;aspect-ratio:2;object-fit:contain;background:#0b0e13;border-radius:12px}.muted{color:#a5b3ca}.row{display:flex;gap:32px;flex-wrap:wrap}</style>
<main><h1>NotFlyGuy</h1><p class="muted">Live FlyBody habitat · experimental motor controller</p>
<div class="card"><img id="frame" alt="Live rendered FlyBody simulation"></div>
<div class="card row"><div>Status <strong id="status">Connecting…</strong></div><div>Simulation step <strong id="step">—</strong></div><div>Goal <strong id="goal">—</strong></div></div>
<p class="muted">The current controller sends zero motor commands. Connectome activity and learned movement are not implemented yet.</p>
<div class="card"><h2>Signal connection</h2><p>Integration pending verification.</p><p id="message"></p></div></main>
<script>
const byId=id=>document.getElementById(id);
const events=new EventSource('/events');
let lastUpdate=0;
events.onmessage=({data})=>{
 const state=JSON.parse(data);
 lastUpdate=Date.now();
 if(state.frame)byId('frame').src=state.frame;
 byId('status').textContent=state.frame?'Live':'Waiting for renderer';
 byId('step').textContent=state.timestep;
 byId('goal').textContent=state.goal;
 byId('message').textContent=state.last_message;
};
events.onerror=()=>byId('status').textContent='Reconnecting…';
setInterval(()=>{if(lastUpdate&&Date.now()-lastUpdate>5000)byId('status').textContent='Stream stalled'},1000);
</script></html>
